<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RoadWatch Maps</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
:root{--ink:#3D405B;--muted:#5E617A;--line:#E4DFC8;--card:#FBF9EF;--blue:#3F7A60;--red:#C9573F;--amber:#E0A94E;--green:#5E9C7E}
*{box-sizing:border-box}
html,body{height:100%;margin:0;font:15px/1.4 "Plus Jakarta Sans","Segoe UI",Roboto,system-ui,sans-serif;color:var(--ink)}
#map{position:absolute;inset:0}
.panel{position:absolute;top:12px;left:12px;width:392px;max-height:calc(100% - 24px);background:var(--card);border-radius:20px;box-shadow:0 10px 30px rgba(61,64,91,.18);display:flex;flex-direction:column;z-index:5;overflow:hidden}
.search{display:flex;align-items:center;gap:6px;padding:8px 10px}
.search input{flex:1;border:0;outline:0;font:inherit;font-size:16px;padding:8px 4px;min-width:0;background:transparent}
.ib{border:0;background:none;width:38px;height:38px;border-radius:50%;cursor:pointer;display:grid;place-items:center;color:var(--blue);flex:none}
.ib:hover{background:#EFEBD6}.ib svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sugg{border-top:1px solid var(--line);max-height:260px;overflow:auto}
.sugg button{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 14px;cursor:pointer;font:inherit}
.sugg button:hover{background:#EFEBD6}.sugg small{color:var(--muted);display:block}
.dir{padding:10px 12px;border-top:1px solid var(--line);display:none;gap:8px}
.dir.on{display:grid}
.fld{display:flex;align-items:center;gap:8px}
.fld .dot{width:12px;height:12px;border-radius:50%;border:3px solid var(--blue);flex:none}
.fld .dot.b{border-color:var(--red);background:var(--red)}
.fld input{flex:1;border:1px solid var(--line);border-radius:8px;padding:9px 10px;font:inherit;min-width:0}
.body{overflow:auto;flex:1}
.banner{margin:10px 12px 0;padding:10px 12px;border-radius:14px;background:#DDEBE2;color:#2F5C47;font-weight:600}
.banner.warn{background:#fff3e0;color:#8a4b00}.banner.bad{background:#fdecea;color:#8c1d14}
.route{margin:8px 12px;padding:10px 12px;border:1.5px solid var(--line);border-radius:16px;cursor:pointer}
.route.sel{border-color:#81B29A;background:#EEF4EA}
.route .t{display:flex;justify-content:space-between;align-items:baseline;font-size:17px;font-weight:600}
.route .t span{color:var(--muted);font-weight:400;font-size:14px}
.route .d{margin-top:4px;font-size:14px;color:var(--muted)}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px;margin-right:4px;background:#eef0f2;color:#3c4043}
.chip.rec{background:#81B29A;color:#2F3249}.chip.bad{background:#fdecea;color:#8c1d14}.chip.ok{background:#DDEBE2;color:#2F5C47}
.card{padding:14px 16px;border-top:1px solid var(--line)}
.card h3{margin:0 0 2px;font-size:19px}
.card .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{border:1px solid var(--line);background:#FBF9EF;border-radius:999px;padding:8px 16px;font:600 14px inherit;cursor:pointer;color:var(--blue)}
.btn.p{background:#81B29A;border-color:#81B29A;color:#2F3249}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin-top:8px;font-size:14px}.kv b{color:var(--muted);font-weight:500}
.layers{position:absolute;top:12px;left:428px;display:flex;gap:8px;z-index:4;flex-wrap:wrap}
.pill{background:#FBF9EF;border:0;border-radius:999px;padding:8px 14px;box-shadow:0 1px 6px rgba(0,0,0,.3);font:600 14px inherit;cursor:pointer;color:var(--ink);display:flex;align-items:center;gap:7px}
.pill i{width:10px;height:10px;border-radius:50%;background:#bbb}.pill.on i{background:var(--green)}
.pill.on{background:#DDEBE2;color:#2F5C47}
.legend{position:absolute;left:12px;bottom:26px;background:#FBF9EF;border-radius:10px;padding:8px 12px;box-shadow:0 1px 6px rgba(0,0,0,.3);font-size:12.5px;z-index:3;display:flex;gap:12px;align-items:center}
.legend span{display:inline-flex;align-items:center;gap:5px}.legend i{width:16px;height:6px;border-radius:3px}
.live{position:absolute;right:12px;top:12px;background:#FBF9EF;border-radius:999px;padding:6px 12px;box-shadow:0 1px 6px rgba(0,0,0,.3);font-size:13px;font-weight:600;z-index:4;display:flex;gap:6px;align-items:center}
.live i{width:9px;height:9px;border-radius:50%;background:#9aa1aa}.live.on i{background:var(--green);box-shadow:0 0 0 3px rgba(30,158,87,.25)}
#toasts{position:absolute;left:50%;transform:translateX(-50%);bottom:22px;z-index:9;display:grid;gap:8px;width:min(440px,calc(100vw - 24px))}
.toast{background:#3D405B;color:#fff;border-radius:10px;padding:10px 14px;box-shadow:0 4px 16px rgba(0,0,0,.4);font-size:14px}
.stat3{display:flex;gap:10px;align-items:baseline;margin-top:6px}.stat3 b{font-size:34px;line-height:1}.stat3 span{color:var(--muted)}
.dl{display:grid;gap:2px;margin-top:8px;max-height:260px;overflow:auto}
.dl button{display:flex;gap:8px;align-items:center;border:0;background:none;text-align:left;padding:6px 4px;border-radius:8px;cursor:pointer;font:inherit;font-size:14px}
.dl button:hover{background:#EFEBD6}.dl em{font-style:normal;color:var(--muted);min-width:52px}.dl .sv{margin-left:auto;font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px;background:#fff3e0;color:#8a4b00}.dl .sv.hi{background:#fdecea;color:#8c1d14}
.pin{width:26px;height:26px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.45)}
.maplibregl-ctrl-bottom-right{bottom:12px}
@media (max-width:760px){
  .panel{top:auto;bottom:0;left:0;right:0;width:100%;max-height:58%;border-radius:18px 18px 0 0}
  .layers{left:12px;top:12px;right:130px}
  .legend{display:none}
}
</style>
</head>
<body>
<div id="map"></div>

<div class="panel" id="panel">
  <div class="search">
    <input id="q" placeholder="Search a place or road" autocomplete="off" aria-label="Search places">
    <button class="ib" id="go-dir" title="Directions" aria-label="Directions"><svg viewBox="0 0 24 24"><path d="M3 11l18-8-8 18-2-8-8-2z"/></svg></button>
  </div>
  <div class="dir" id="dir">
    <div class="fld"><span class="dot"></span><input id="from" placeholder="Choose starting point" autocomplete="off"><button class="ib" id="here" title="Use my location" aria-label="Use my location"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="8"/></svg></button></div>
    <div class="fld"><span class="dot b"></span><input id="to" placeholder="Choose destination" autocomplete="off"><button class="ib" id="swap" title="Swap" aria-label="Swap start and destination"><svg viewBox="0 0 24 24"><path d="M7 4v16M7 4L3 8M7 4l4 4M17 20V4M17 20l-4-4M17 20l4-4"/></svg></button></div>
    <div class="fld" style="justify-content:flex-end"><button class="btn" id="close-dir">Close</button><button class="btn p" id="plan">Get directions</button></div>
  </div>
  <div class="sugg" id="sugg"></div>
  <div class="body" id="body"></div>
</div>

<div class="layers" id="layers">
  <button class="pill on" data-l="zones"><i></i>Damage zones</button>
  <button class="pill on" data-l="defects"><i></i>Potholes</button>
  <button class="pill" id="p3d"><i></i>3D view</button>
</div>
<div class="live" id="live"><i></i><span>Connecting</span></div>
<div class="legend"><span><i style="background:#3F7A60"></i>Clear road</span><span><i style="background:#E0A94E"></i>Damaged</span><span><i style="background:#C9573F"></i>Severe</span></div>
<div id="toasts"></div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
(function () {
  var NAMES = { pothole: "Pothole", alligator_crack: "Alligator cracks", longitudinal_crack: "Long crack", transverse_crack: "Cross crack",
    manhole: "Manhole", speed_breaker: "Speed breaker", debris: "Debris", barricade: "Barricade" };
  var COL = { red: "#C9573F", yellow: "#E0A94E", green: "#1e9e57" };
  function esc(t) { return String(t == null ? "" : t).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function $(id) { return document.getElementById(id); }
  function toast(t) { var e = document.createElement("div"); e.className = "toast"; e.textContent = t; $("toasts").appendChild(e); setTimeout(function () { e.remove(); }, 6500); }

  var map = new maplibregl.Map({ container: "map", style: "https://tiles.openfreemap.org/styles/liberty", center: [77.5946, 12.9716], zoom: 12, attributionControl: { compact: true } });
  map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), "bottom-right");
  var geo = new maplibregl.GeolocateControl({ positionOptions: { enableHighAccuracy: true }, trackUserLocation: true });
  map.addControl(geo, "bottom-right");

  var officerToken = null, officerMode = false;
  window.addEventListener("message", function (e) {
    var m = e.data || {};
    if (m.type === "rw-auth") { officerToken = m.token || null; officerMode = !!m.officer; document.body.classList.toggle("officer", officerMode); if (lastRes) renderRoutes(); }
  });
  function officerPatch(ids, status) {
    return fetch("/api/defects/bulk-status", { method: "POST", headers: officerToken ? { "Content-Type": "application/json", "Authorization": "Bearer " + officerToken } : { "Content-Type": "application/json" },
      body: JSON.stringify({ ids: ids, status: status }) }).then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.detail || "Not allowed"); return j; }); });
  }
  var defects = [], ready = false, endpoints = { from: null, to: null }, lastRes = null, selIdx = 0, markers = [];

  function circlePoly(lat, lon, r) {
    var pts = [], k = 28, dLat = r / 110540, dLon = r / (111320 * Math.cos(lat * Math.PI / 180));
    for (var i = 0; i <= k; i++) { var a = i / k * 2 * Math.PI; pts.push([lon + dLon * Math.cos(a), lat + dLat * Math.sin(a)]); }
    return [pts];
  }
  function defectFC() {
    return { type: "FeatureCollection", features: defects.filter(function (d) { return d.lat != null; }).map(function (d) {
      return { type: "Feature", geometry: { type: "Point", coordinates: [d.lon, d.lat] },
        properties: { uid: d.uid, number: d.number, cls: d["class"], sev: d.severity || "", status: d.status || "active", reports: d.reports || 1,
          c: d.status === "repaired" ? "#1e9e57" : (/crit|sev/i.test(d.severity || "") ? "#C9573F" : "#E0A94E") } };
    }) };
  }
  function setDefects() { if (ready) map.getSource("defects").setData(defectFC()); }

  map.on("load", function () {
    map.addSource("zones", { type: "geojson", data: { type: "FeatureCollection", features: [] } });
    map.addSource("defects", { type: "geojson", data: defectFC(), cluster: true, clusterRadius: 38, clusterMaxZoom: 14 });
    map.addSource("route", { type: "geojson", data: { type: "FeatureCollection", features: [] } });
    map.addSource("alts", { type: "geojson", data: { type: "FeatureCollection", features: [] } });
    map.addLayer({ id: "zones-fill", type: "fill", source: "zones", paint: { "fill-color": ["get", "c"], "fill-opacity": 0.22 } });
    map.addLayer({ id: "zones-line", type: "line", source: "zones", paint: { "line-color": ["get", "c"], "line-width": 1.4, "line-opacity": 0.7 } });
    map.addLayer({ id: "alts", type: "line", source: "alts", layout: { "line-cap": "round", "line-join": "round" }, paint: { "line-color": "#8a9097", "line-width": 6, "line-opacity": 0.75 } });
    map.addLayer({ id: "route-casing", type: "line", source: "route", layout: { "line-cap": "round", "line-join": "round" }, paint: { "line-color": "#fff", "line-width": 11 } });
    map.addLayer({ id: "route", type: "line", source: "route", layout: { "line-cap": "round", "line-join": "round" }, paint: { "line-color": ["get", "c"], "line-width": 7 } });
    map.addLayer({ id: "clusters", type: "circle", source: "defects", filter: ["has", "point_count"],
      paint: { "circle-color": "#C9573F", "circle-opacity": 0.88, "circle-stroke-color": "#fff", "circle-stroke-width": 2, "circle-radius": ["step", ["get", "point_count"], 14, 10, 18, 40, 24] } });
    map.addLayer({ id: "cluster-n", type: "symbol", source: "defects", filter: ["has", "point_count"], layout: { "text-field": ["get", "point_count_abbreviated"], "text-size": 12, "text-font": ["Noto Sans Bold"] }, paint: { "text-color": "#fff" } });
    map.addLayer({ id: "pts", type: "circle", source: "defects", filter: ["!", ["has", "point_count"]],
      paint: { "circle-color": ["get", "c"], "circle-radius": 7, "circle-stroke-color": "#fff", "circle-stroke-width": 2 } });
    ready = true;
    loadZones(); loadDefects();
    map.on("click", "clusters", function (e) {
      var f = map.queryRenderedFeatures(e.point, { layers: ["clusters"] })[0];
      map.getSource("defects").getClusterExpansionZoom(f.properties.cluster_id).then(function (z) { map.easeTo({ center: f.geometry.coordinates, zoom: z + 0.5 }); });
    });
    map.on("click", "pts", function (e) { showDefect(e.features[0].properties.uid, true); });
    ["clusters", "pts"].forEach(function (l) {
      map.on("mouseenter", l, function () { map.getCanvas().style.cursor = "pointer"; });
      map.on("mouseleave", l, function () { map.getCanvas().style.cursor = ""; });
    });
  });

  function loadZones() {
    fetch("/api/public/zones").then(function (r) { return r.json(); }).then(function (z) {
      map.getSource("zones").setData({ type: "FeatureCollection", features: (z.cells || []).map(function (c) {
        return { type: "Feature", geometry: { type: "Polygon", coordinates: circlePoly(c.lat, c.lon, c.size_m * 0.62) }, properties: { c: COL[c.level] || COL.green, label: c.label } };
      }) });
    }).catch(function () {});
  }
  function loadDefects() {
    fetch("/api/public/defects").then(function (r) { return r.json(); }).then(function (l) {
      defects = l; setDefects();
      var h = (location.hash || "").replace("#", "");
      if (h) showDefect(h, true);
    }).catch(function () { toast("Could not load road damage data."); });
  }

  var is3d = false;
  function set3d(on) {
    is3d = on; $("p3d").classList.toggle("on", on);
    try { map.setLayoutProperty("building-3d", "visibility", "visible"); } catch (e) {}
    map.easeTo({ pitch: on ? 58 : 0, bearing: on ? -18 : 0, duration: 800 });
  }
  $("p3d").onclick = function () { set3d(!is3d); };

  // ---- layer toggles
  document.querySelectorAll("#layers .pill").forEach(function (b) {
    b.onclick = function () {
      var on = !b.classList.contains("on"); b.classList.toggle("on", on);
      var ids = b.dataset.l === "zones" ? ["zones-fill", "zones-line"] : ["clusters", "cluster-n", "pts"];
      ids.forEach(function (id) { map.setLayoutProperty(id, "visibility", on ? "visible" : "none"); });
    };
  });

  // ---- place search (Nominatim, India) with debounce
  var timer = null, activeInput = null;
  function search(input) {
    activeInput = input; clearTimeout(timer);
    var q = input.value.trim(); if (q.length < 3) { $("sugg").innerHTML = ""; return; }
    timer = setTimeout(function () {
      var c = map.getCenter();
      fetch("https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&countrycodes=in&viewbox=" + (c.lng - 1) + "," + (c.lat + 1) + "," + (c.lng + 1) + "," + (c.lat - 1) + "&q=" + encodeURIComponent(q))
        .then(function (r) { return r.json(); }).then(function (hits) {
          if (input !== activeInput) return;
          $("sugg").innerHTML = hits.map(function (h, i) {
            var p = (h.display_name || "").split(", ");
            return "<button data-i='" + i + "'><b>" + esc(p[0]) + "</b><small>" + esc(p.slice(1, 4).join(", ")) + "</small></button>";
          }).join("") || "<button disabled>No places found</button>";
          Array.prototype.forEach.call($("sugg").querySelectorAll("button[data-i]"), function (b) {
            b.onclick = function () { pick(input, hits[+b.dataset.i]); };
          });
        }).catch(function () {});
    }, 420);
  }
  function pick(input, h) {
    $("sugg").innerHTML = "";
    var pt = { lat: parseFloat(h.lat), lon: parseFloat(h.lon), name: (h.display_name || "").split(", ").slice(0, 2).join(", ") };
    input.value = pt.name;
    if (input.id === "q") { placeCard(pt, h.display_name); map.flyTo({ center: [pt.lon, pt.lat], zoom: 15 }); }
    else { endpoints[input.id === "from" ? "from" : "to"] = pt; }
  }
  ["q", "from", "to"].forEach(function (id) { $(id).addEventListener("input", function () { search($(id)); if (id !== "q") endpoints[id] = null; }); });

  var pm = null;
  function placeCard(pt, full) {
    if (pm) pm.remove();
    pm = new maplibregl.Marker({ color: "#C9573F" }).setLngLat([pt.lon, pt.lat]).addTo(map);
    var near = defects.filter(function (d) { return d.lat != null && dist(d.lat, d.lon, pt.lat, pt.lon) < 300 && d.status !== "repaired"; }).length;
    $("body").innerHTML = "<div class='card'><h3>" + esc(pt.name) + "</h3><div style='color:#5f6670'>" + esc(full || "") + "</div>" +
      "<div class='row'><span class='chip " + (near ? "bad" : "ok") + "'>" + (near ? near + " reported road defects within 300 m" : "No reported road damage nearby") + "</span></div>" +
      "<div class='row'><button class='btn p' id='dto'>Directions</button></div></div>";
    $("dto").onclick = function () { openDir(); $("to").value = pt.name; endpoints.to = pt; if (!endpoints.from) $("from").focus(); else plan(); };
  }

  function dist(a, b, c, d) { var dx = (d - b) * Math.cos((a + c) / 2 * Math.PI / 180) * 111320, dy = (c - a) * 110540; return Math.sqrt(dx * dx + dy * dy); }

  // ---- defect card
  function showDefect(uid, fly) {
    var d = defects.filter(function (x) { return String(x.uid).toUpperCase() === String(uid).toUpperCase(); })[0];
    if (!d) return;
    if (fly) map.flyTo({ center: [d.lon, d.lat], zoom: Math.max(map.getZoom(), 16) });
    history.replaceState(null, "", "#" + d.uid);
    $("body").innerHTML = "<div class='card'><h3>" + esc(NAMES[d["class"]] || "Road damage") + " " + esc(d.number) + "</h3>" +
      "<div class='row' style='margin-top:6px'><span class='chip " + (d.status === "repaired" ? "ok" : "bad") + "'>" + (d.status === "repaired" ? "Repaired" : "Open") + "</span><span class='chip'>" + esc(d.severity || "Unrated") + "</span></div>" +
      "<div class='kv'><b>Reports</b><span>" + esc(d.reports || 1) + "</span><b>First seen</b><span>" + esc((d.first_seen || "").slice(0, 10)) + "</span><b>Last seen</b><span>" + esc((d.last_seen || "").slice(0, 10)) + "</span><b id='rl'></b><span id='rv'></span></div>" +
      "<div class='row'><button class='btn p' id='dd'>Directions here</button>" +
      (officerMode ? "<button class='btn' id='ofix'>" + (d.status === "repaired" ? "Reopen defect" : "Mark repaired") + "</button>" : "") + "</div></div>";
    if ($("ofix")) $("ofix").onclick = function () {
      officerPatch([d.number], d.status === "repaired" ? "active" : "repaired").then(function () { toast("Updated."); }).catch(function (e) { toast(e.message); });
    };
    $("dd").onclick = function () { openDir(); var p = { lat: d.lat, lon: d.lon, name: (NAMES[d["class"]] || "Damage") + " " + d.number }; $("to").value = p.name; endpoints.to = p; };
  }

  // ---- directions
  function openDir() { $("dir").classList.add("on"); }
  $("go-dir").onclick = function () { openDir(); $("from").focus(); };
  $("close-dir").onclick = function () { $("dir").classList.remove("on"); clearRoute(); $("body").innerHTML = ""; };
  $("swap").onclick = function () {
    var a = $("from").value; $("from").value = $("to").value; $("to").value = a;
    var t = endpoints.from; endpoints.from = endpoints.to; endpoints.to = t;
  };
  $("here").onclick = function () {
    if (!navigator.geolocation) { toast("Location is not available in this browser."); return; }
    navigator.geolocation.getCurrentPosition(function (p) {
      endpoints.from = { lat: p.coords.latitude, lon: p.coords.longitude, name: "Your location" }; $("from").value = "Your location";
    }, function () { toast("Location permission was denied. Type a start place instead."); }, { enableHighAccuracy: true, timeout: 12000 });
  };
  function clearRoute() {
    markers.forEach(function (m) { m.remove(); }); markers = [];
    map.getSource("route").setData({ type: "FeatureCollection", features: [] });
    map.getSource("alts").setData({ type: "FeatureCollection", features: [] });
    lastRes = null;
  }
  function ptText(which) {
    var p = endpoints[which]; if (p) return p.lat.toFixed(6) + "," + p.lon.toFixed(6);
    return $(which).value.trim();
  }
  function plan(quiet) {
    var o = ptText("from"), d = ptText("to");
    clearTimeout(timer); $("sugg").innerHTML = "";
    if (!o || !d) { toast("Enter a start and a destination."); return; }
    if (!quiet) $("body").innerHTML = "<div class='banner warn'>Comparing routes and road damage...</div>";
    fetch("/api/routeplan?origin=" + encodeURIComponent(o) + "&dest=" + encodeURIComponent(d))
      .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.detail || "Could not plan this trip"); return j; }); })
      .then(function (j) {
        var was = lastRes ? lastRes.recommended : null;
        lastRes = j; selIdx = j.recommended; renderRoutes(); drawRoute(true);
        if (quiet && was !== null && was !== j.recommended) toast("A new report changed the best route.");
      }).catch(function (e) { $("body").innerHTML = "<div class='banner bad'>" + esc(e.message) + "</div>"; });
  }
  $("plan").onclick = function () { plan(false); };

  function fmtMin(m) { return m >= 60 ? Math.floor(m / 60) + " h " + Math.round(m % 60) + " min" : Math.round(m) + " min"; }
  function renderRoutes() {
    var res = lastRes, rec = res.routes[res.recommended], fast = res.routes[res.fastest], html = "";
    if (res.routes.length > 1 && rec !== fast) {
      var saved = fast.defect_count - rec.defect_count, extra = Math.max(0, Math.round((rec.duration_min - fast.duration_min) * 10) / 10);
      html += "<div class='banner'>Better route found: Route " + (rec.index + 1) + " avoids " + saved + " reported road defects" +
        (fast.severe_count > rec.severe_count ? " (" + (fast.severe_count - rec.severe_count) + " serious)" : "") + (extra ? " for " + extra + " min more." : ".") + "</div>";
    } else if (rec.defect_count === 0) {
      html += "<div class='banner'>This route has no reported road damage.</div>";
    } else {
      html += "<div class='banner warn'>Best available route still passes " + rec.defect_count + " reported defects (" + rec.severe_count + " serious). Drive carefully.</div>";
    }
    res.routes.forEach(function (r) {
      var chips = r.labels.map(function (l) { return "<span class='chip" + (l === "recommended" ? " rec" : "") + "'>" + esc(l) + "</span>"; }).join("");
      var eta = new Date(Date.now() + r.duration_min * 60000).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
      html += "<div class='route" + (r.index === selIdx ? " sel" : "") + "' data-i='" + r.index + "'><div class='t'>" + fmtMin(r.duration_min) + "<span>" + r.distance_km + " km, arrive " + eta + "</span></div>" +
        "<div class='d'>" + (r.detour ? "<span class='chip'>avoids damaged roads</span>" : "") + chips + "<span class='chip " + (r.defect_count ? "bad" : "ok") + "'>" + (r.defect_count ? r.defect_count + " potholes and defects" : "No damage reported") + "</span></div></div>";
    });
    html += routeDetail(res.routes[selIdx]);
    $("body").innerHTML = html;
    if ($("ofixall")) $("ofixall").onclick = function () {
      var ids = lastRes.routes[selIdx].defects.map(function (h) { return h.number; });
      if (!confirm("Mark " + ids.length + " defects on this route as repaired?")) return;
      officerPatch(ids, "repaired").then(function (j) { toast(j.updated + " defects marked repaired."); }).catch(function (e) { toast(e.message); });
    };
    Array.prototype.forEach.call($("body").querySelectorAll(".dl button"), function (el) {
      if (el.dataset.lat === "null") { el.disabled = true; return; }
      el.onclick = function () { map.flyTo({ center: [+el.dataset.lon, +el.dataset.lat], zoom: 17, pitch: is3d ? 58 : 0 }); };
    });
    Array.prototype.forEach.call($("body").querySelectorAll(".route"), function (el) {
      el.onclick = function () { selIdx = +el.dataset.i; renderRoutes(); drawRoute(false); };
    });
  }
  function routeDetail(r) {
    var g = r.geometry, cum = [0];
    for (var i = 1; i < g.length; i++) cum.push(cum[i - 1] + dist(g[i - 1][0], g[i - 1][1], g[i][0], g[i][1]));
    var scale = (r.distance_km * 1000) / (cum[cum.length - 1] || 1);
    var list = r.defects.map(function (h) {
      var bi = 0, bd = 1e9;
      for (var k = 0; k < g.length; k += 1) { var dd = dist(g[k][0], g[k][1], h.lat, h.lon); if (dd < bd) { bd = dd; bi = k; } }
      return { h: h, km: cum[bi] * scale / 1000 };
    }).sort(function (a, b) { return a.km - b.km; });
    var ph = r.defects.filter(function (h) { return h["class"] === "pothole"; }).length, other = r.defects.length - ph, cnt = {};
    r.defects.forEach(function (h) { var n = NAMES[h["class"]] || "Other"; cnt[n] = (cnt[n] || 0) + 1; });
    var chips = Object.keys(cnt).map(function (n) { return "<span class='chip'>" + esc(n) + " " + cnt[n] + "</span>"; }).join("");
    var stepsHtml = (r.steps || []).map(function (st) {
      var d = st.distance_m >= 1000 ? (st.distance_m / 1000).toFixed(1) + " km" : st.distance_m + " m";
      return "<button data-lat='" + st.lat + "' data-lon='" + st.lon + "'><em>" + d + "</em><span>" + esc(st.text) + "</span></button>";
    }).join("");
    var ids = r.defects.map(function (h) { return h.number; });
    var ofc = officerMode && ids.length ? "<div class='card'><h3>Officer actions</h3><div class='row'><button class='btn p' id='ofixall'>Mark all " + ids.length + " defects on this route repaired</button></div></div>" : "";
    return ofc + "<div class='card'><h3>Journey: Route " + (r.index + 1) + "</h3><div class='kv'><b>Distance</b><span>" + r.distance_km + " km</span><b>Time</b><span>" + fmtMin(r.duration_min) + "</span><b>Road damage</b><span>" + r.defect_count + " reported (" + r.potholes + " potholes)</span></div>" +
      "<details style='margin-top:10px'><summary style='cursor:pointer;font-weight:600'>Step-by-step directions (" + (r.steps || []).length + ")</summary><div class='dl'>" + stepsHtml + "</div></details></div>" +
      "<div class='card'><h3>Road damage on Route " + (r.index + 1) + "</h3>" +
      "<div class='stat3'><b>" + ph + "</b><span>potholes</span><b style='font-size:22px'>" + other + "</b><span>other defects</span><b style='font-size:22px;color:var(--red)'>" + r.severe_count + "</b><span>serious</span></div>" +
      "<div class='row'>" + chips + "</div>" +
      "<div class='dl'>" + (list.map(function (x) {
        var h = x.h; return "<button data-lat='" + h.lat + "' data-lon='" + h.lon + "'><em>" + x.km.toFixed(1) + " km</em><span>" + esc(NAMES[h["class"]] || "Damage") + " " + esc(h.number) + "</span><span class='sv" + (h.risk >= 70 ? " hi" : "") + "'>" + (h.risk >= 70 ? "Serious" : "Moderate") + "</span></button>";
      }).join("") || "<div style='color:var(--muted);padding:6px 0'>No reported damage on this route.</div>") + "</div></div>";
  }
  function drawRoute(fit) {
    var res = lastRes; if (!res) return;
    markers.forEach(function (m) { m.remove(); }); markers = [];
    var alts = res.routes.filter(function (r) { return r.index !== selIdx; }).map(function (r) {
      return { type: "Feature", geometry: { type: "LineString", coordinates: r.geometry.map(function (p) { return [p[1], p[0]]; }) }, properties: {} };
    });
    map.getSource("alts").setData({ type: "FeatureCollection", features: alts });
    var r = res.routes[selIdx], g = r.geometry, feats = [];
    for (var i = 0; i < g.length - 1; i++) {
      var mid = [(g[i][0] + g[i + 1][0]) / 2, (g[i][1] + g[i + 1][1]) / 2], worst = 0;
      for (var k = 0; k < r.defects.length; k++) { var h = r.defects[k]; if (dist(mid[0], mid[1], h.lat, h.lon) < 28) worst = Math.max(worst, h.risk >= 70 ? 2 : 1); }
      feats.push({ type: "Feature", geometry: { type: "LineString", coordinates: [[g[i][1], g[i][0]], [g[i + 1][1], g[i + 1][0]]] }, properties: { c: worst === 2 ? "#C9573F" : worst === 1 ? "#E0A94E" : "#3F7A60" } });
    }
    map.getSource("route").setData({ type: "FeatureCollection", features: feats });
    r.defects.forEach(function (h) {
      var el = document.createElement("div"); el.className = "pin"; el.style.background = h.risk >= 70 ? "#C9573F" : "#E0A94E";
      markers.push(new maplibregl.Marker({ element: el }).setLngLat([h.lon, h.lat]).setPopup(new maplibregl.Popup({ offset: 18 }).setHTML("<b>" + esc(NAMES[h["class"]] || "Road damage") + " " + esc(h.number) + "</b><br>Risk " + Math.round(h.risk))).addTo(map));
    });
    markers.push(new maplibregl.Marker({ color: "#3F7A60" }).setLngLat([res.origin.lon, res.origin.lat]).addTo(map));
    markers.push(new maplibregl.Marker({ color: "#C9573F" }).setLngLat([res.destination.lon, res.destination.lat]).addTo(map));
    if (fit) {
      var b = new maplibregl.LngLatBounds();
      g.forEach(function (p) { b.extend([p[1], p[0]]); });
      map.fitBounds(b, { padding: { top: 60, bottom: 60, left: window.innerWidth > 760 ? 440 : 40, right: 60 }, duration: 700, pitch: is3d ? 58 : 0 });
    }
  }

  // ---- live feed
  var retry = 1000;
  function setLive(on, t) { $("live").className = "live" + (on ? " on" : ""); $("live").lastChild.textContent = t; }
  function connect() {
    var ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws/events");
    ws.onopen = function () { retry = 1000; setLive(true, "Live"); };
    ws.onmessage = function (e) {
      var m; try { m = JSON.parse(e.data); } catch (_) { return; }
      var d = m.data || {};
      if (m.type === "map.defect") {
        var i = -1; defects.forEach(function (x, n) { if (String(x.uid) === String(d.uid)) i = n; });
        if (i >= 0) defects[i] = Object.assign(defects[i], d); else defects.push(d);
        setDefects(); loadZones();
        toast((d["new"] ? "New " : "Updated: ") + (NAMES[d["class"]] || "road damage").toLowerCase() + " reported on the map.");
        if (lastRes) plan(true);
      } else if (m.type === "map.repair") {
        defects.forEach(function (x) { if (String(x.uid) === String(d.uid)) x.status = "repaired"; });
        setDefects(); loadZones(); toast("A road defect was marked repaired.");
        if (lastRes) plan(true);
      } else if (m.type === "map.report") { toast("A new report was just filed on the map."); }
    };
    ws.onclose = function () { setLive(false, "Reconnecting"); setTimeout(connect, retry = Math.min(retry * 2, 15000)); };
  }
  connect();
  window.addEventListener("hashchange", function () { var h = location.hash.replace("#", ""); if (h) showDefect(h, true); });
})();
</script>
</body>
</html>
