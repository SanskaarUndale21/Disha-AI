<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Disha AI Maps</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --ink:#3D405B;--muted:#6B6E86;--line:rgba(61,64,91,.12);--sage:#81B29A;--sage-d:#3F7A60;--sage-bg:rgba(129,178,154,.2);
  --peach:#F2CC8F;--ivory:#F4F1DE;--terra:#E07A5F;--terra-d:#B4513A;--terra-bg:rgba(224,122,95,.16);--amber:#E9A93C;--amber-bg:rgba(242,204,143,.35);
  --glass:rgba(251,249,240,.9);--solid:#FBF9F0;--hover:rgba(61,64,91,.06);--shadow:0 10px 36px rgba(61,64,91,.22),0 2px 8px rgba(61,64,91,.12);
  --field:rgba(61,64,91,.06);--sheet-h:150px;--serif:"Instrument Serif",Georgia,serif;
}
:root[data-theme=dark]{
  --ink:#F4F1DE;--muted:#A6A9C0;--line:rgba(244,241,222,.14);--sage:#81B29A;--sage-d:#97C9B0;--sage-bg:rgba(129,178,154,.2);
  --glass:rgba(34,36,52,.9);--solid:#262839;--hover:rgba(244,241,222,.08);--shadow:0 10px 36px rgba(0,0,0,.5),0 2px 8px rgba(0,0,0,.4);
  --field:rgba(244,241,222,.08);--terra-bg:rgba(224,122,95,.22);--amber-bg:rgba(242,204,143,.18);--terra-d:#F0907A;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden}
body{font:14.5px/1.4 "Plus Jakarta Sans","Segoe UI",Roboto,system-ui,sans-serif;color:var(--ink);background:var(--ivory)}
:root[data-theme=dark] body{background:#1d1f2c}
button{font:inherit;color:inherit}
#map{position:absolute;inset:0}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.i.s{width:18px;height:18px}.i.f{fill:currentColor;stroke:none}
.ser{font-family:var(--serif);font-weight:400}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* panel */
#panel{position:absolute;z-index:6;top:12px;left:12px;width:400px;max-height:calc(100dvh - 24px);display:flex;flex-direction:column;background:var(--glass);
  -webkit-backdrop-filter:blur(20px) saturate(1.4);backdrop-filter:blur(20px) saturate(1.4);border-radius:22px;box-shadow:var(--shadow);overflow:hidden;
  border:1px solid var(--line);animation:rise .45s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
#grab{display:none;height:26px;flex:none;cursor:grab;touch-action:none;align-items:center;justify-content:center}
#grab i{width:42px;height:5px;border-radius:3px;background:var(--line);filter:contrast(2)}
#head{flex:none;padding:10px 12px 8px}
#body{flex:1;overflow:auto;overscroll-behavior:contain;padding:0 0 12px;min-height:0}
.brand{flex:none;display:flex;justify-content:space-between;align-items:center;padding:7px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.brand a{color:var(--sage-d);font-weight:700;text-decoration:none}
body.app .ext{display:none!important}
.searchbar{display:flex;align-items:center;gap:4px;background:var(--field);border-radius:16px;padding:0 4px 0 12px;height:52px}
.searchbar input,.fields input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:inherit;font-size:16px;color:var(--ink);height:100%}
.searchbar input::placeholder,.fields input::placeholder{color:var(--muted)}
.searchbar:focus-within,.fields:focus-within{box-shadow:0 0 0 2px var(--sage)}
.ib{border:0;background:none;width:44px;height:44px;border-radius:50%;cursor:pointer;display:grid;place-items:center;color:var(--muted);flex:none;transition:background .15s}
.ib:hover{background:var(--hover)}.ib:active{transform:scale(.94)}
.ib.sm{width:36px;height:36px}
.dirbtn{border:0;background:var(--sage);color:#2b3a33;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;cursor:pointer;flex:none}
.dirbtn:hover{filter:brightness(1.06)}
.btn{border:1px solid var(--line);background:var(--solid);color:var(--ink);border-radius:999px;min-height:44px;padding:0 18px;font-weight:700;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s,filter .15s}
.btn:hover{filter:brightness(.97)}.btn:active{transform:scale(.97)}
.btn.p{background:var(--sage-d);border-color:transparent;color:#fff}
:root[data-theme=dark] .btn.p{background:var(--sage);color:#1d2a24}
.btn.d{background:var(--terra);border-color:transparent;color:#fff}
.btn.big{min-height:52px;font-size:15px;flex:1}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pad{padding:6px 14px}
.sec{padding:10px 14px 4px;font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* directions head */
.mt{display:flex;gap:6px;align-items:center;margin-bottom:8px}
.modes{display:flex;flex:1;background:var(--field);border-radius:14px;padding:3px;gap:2px}
.modes button{flex:1;border:0;background:none;height:42px;border-radius:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;font-weight:700;font-size:12.5px;white-space:nowrap;padding:0 4px;color:var(--muted);transition:all .18s}
.modes button.on{background:var(--solid);color:var(--ink);box-shadow:0 1px 6px rgba(61,64,91,.18)}
.modes button.on .i{color:var(--sage-d)}
.fields{display:flex;align-items:stretch;background:var(--field);border-radius:16px;padding:0 2px 0 12px}
.dots{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;width:14px;flex:none}
.dots b{width:10px;height:10px;border-radius:50%;border:3px solid var(--sage-d);display:block}
.dots s{width:3px;height:3px;border-radius:50%;background:var(--muted);opacity:.5;display:block}
.dots u{width:11px;height:11px;background:var(--terra);border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:block}
.fi{flex:1;min-width:0}
.fi>div{display:flex;align-items:center;height:46px;padding-left:10px}
.fi>div+div{border-top:1px solid var(--line)}
.opts{display:flex;align-items:center;justify-content:space-between;margin-top:8px;gap:8px;flex-wrap:wrap}
.sw{display:flex;align-items:center;gap:10px;cursor:pointer;min-height:44px;font-weight:700;font-size:13.5px;border:0;background:none;padding:0}
.sw .tr{width:42px;height:24px;border-radius:12px;background:var(--line);position:relative;transition:background .2s;flex:none;filter:contrast(1.6)}
.sw .tr::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.sw[aria-checked=true] .tr{background:var(--sage-d);filter:none}.sw[aria-checked=true] .tr::after{transform:translateX(18px)}
.dep{font-size:12.5px;color:var(--muted);font-weight:600}

/* suggestion rows */
.rowb{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;text-align:left;padding:8px 14px;min-height:52px;cursor:pointer;transition:background .12s}
.rowb:hover,.rowb:focus-visible{background:var(--hover);outline:0}
.ric{width:38px;height:38px;border-radius:50%;background:var(--field);display:grid;place-items:center;color:var(--muted);flex:none}
.ric.g{background:var(--sage-bg);color:var(--sage-d)}.ric.t{background:var(--terra-bg);color:var(--terra-d)}.ric.b{background:rgba(63,122,96,.18);color:var(--sage-d)}
.rt{min-width:0;flex:1}.rt b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rt small{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px}
.qc{display:flex;gap:8px;padding:6px 14px 4px;overflow-x:auto;scrollbar-width:none}
.qc button{flex:none;display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--solid);border-radius:999px;min-height:44px;padding:0 14px;font-weight:700;font-size:13.5px;cursor:pointer}
.qc button .i{color:var(--sage-d)}.qc button small{color:var(--muted);font-weight:500}
.sk{background:linear-gradient(90deg,var(--field) 25%,var(--hover) 50%,var(--field) 75%);background-size:200% 100%;animation:sh 1.2s infinite linear;border-radius:10px}
@keyframes sh{to{background-position:-200% 0}}
.skc{margin:8px 12px;padding:14px;border:1px solid var(--line);border-radius:18px}
.msg{margin:10px 14px;padding:12px 14px;border-radius:14px;background:var(--field);font-weight:600}
.msg.bad{background:var(--terra-bg);color:var(--terra-d)}.msg.good{background:var(--sage-bg);color:var(--sage-d)}.msg.warn{background:var(--amber-bg)}
.msg p{margin:0 0 8px}.msg p:last-child{margin:0}
.hero{margin:10px 14px;padding:16px;border-radius:20px;background:linear-gradient(135deg,rgba(129,178,154,.3),rgba(242,204,143,.35))}
.hero .n{font-family:var(--serif);font-size:54px;line-height:1}.hero span{display:block;color:var(--muted);font-weight:600;margin-top:2px}
.tip{display:flex;gap:10px;align-items:flex-start;padding:6px 14px;color:var(--muted);font-size:12.5px}

/* route cards */
.rc{margin:8px 12px;padding:12px 14px;border:1.5px solid var(--line);border-radius:20px;cursor:pointer;background:var(--solid);transition:border-color .15s,box-shadow .15s,transform .12s;position:relative}
.rc:hover{box-shadow:0 4px 16px rgba(61,64,91,.14)}.rc:active{transform:scale(.995)}
.rc.sel{border-color:var(--sage-d);box-shadow:0 0 0 3px var(--sage-bg)}
.rc .top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.rc .tm{font-family:var(--serif);font-size:38px;line-height:1}.rc .tm small{font-family:"Plus Jakarta Sans",sans-serif;font-size:14px;color:var(--muted);font-weight:600;margin-left:4px}
.rc .sub{text-align:right;font-size:12.5px;color:var(--muted);font-weight:600;line-height:1.35}
.rc .mid{display:flex;align-items:center;gap:12px;margin-top:10px}
.stats{flex:1;font-size:13px;color:var(--muted);font-weight:600}.stats b{color:var(--ink)}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:999px;background:var(--field);color:var(--muted)}
.chip.recommended,.chip.smoothest,.chip.fastest{text-transform:capitalize}.chip.recommended{background:var(--sage);color:#22332b}.chip.smoothest{background:var(--sage-bg);color:var(--sage-d)}.chip.fastest{background:var(--amber-bg);color:var(--ink)}
.chip.sev{background:var(--terra-bg);color:var(--terra-d);text-transform:none}.chip.ok{background:var(--sage-bg);color:var(--sage-d);text-transform:none}
.cmp{margin-top:8px;font-size:13px;font-weight:700;padding:7px 10px;border-radius:12px;background:var(--field)}
.cmp.good{background:var(--sage-bg);color:var(--sage-d)}.cmp.bad{background:var(--terra-bg);color:var(--terra-d)}
.ring{position:relative;width:46px;height:46px;flex:none}.ring svg{width:46px;height:46px;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:14px;font-weight:800}
.ring small{position:absolute;left:0;right:0;bottom:-12px;text-align:center;font-size:9.5px;color:var(--muted);font-weight:700;display:none}
.actions{display:flex;gap:8px;padding:6px 12px}
.card{margin:8px 12px;padding:14px;border:1px solid var(--line);border-radius:18px;background:var(--solid)}
.card h3{margin:0 0 6px;font-size:16px;font-weight:800}
.card.flat{border:0;background:none;padding:6px 14px;margin:0}
.cap{font-size:20px;font-weight:800;margin:0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;margin-top:10px;font-size:13.5px}.kv b{color:var(--muted);font-weight:600}
details.acc{margin:8px 12px;border:1px solid var(--line);border-radius:18px;background:var(--solid);overflow:hidden}
details.acc summary{cursor:pointer;list-style:none;padding:0 14px;min-height:50px;display:flex;align-items:center;justify-content:space-between;font-weight:800}
details.acc summary::-webkit-details-marker{display:none}details.acc summary .i{transition:transform .2s}details.acc[open] summary .i{transform:rotate(90deg)}
.step{display:flex;gap:12px;align-items:center;width:100%;border:0;border-top:1px solid var(--line);background:none;text-align:left;padding:8px 14px;min-height:54px;cursor:pointer}
.step:hover{background:var(--hover)}
.step .si{width:36px;height:36px;border-radius:12px;background:var(--field);display:grid;place-items:center;flex:none}
.step .tx{flex:1;min-width:0;font-weight:600;font-size:13.5px}.step em{font-style:normal;color:var(--muted);font-size:12px;font-weight:700;white-space:nowrap}
.dmg .dd{width:12px;height:12px;border-radius:50%;flex:none;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.leg{display:flex;gap:12px;padding:2px 14px 6px;font-size:12px;color:var(--muted);font-weight:600;flex-wrap:wrap}.leg span{display:inline-flex;align-items:center;gap:5px}.leg i{width:16px;height:6px;border-radius:3px;display:block}

/* floating bits */
#top{position:absolute;z-index:4;top:12px;left:436px;right:12px;display:flex;gap:8px;align-items:center;pointer-events:none}
#top>*{pointer-events:auto}
#pills{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;flex:1;padding:2px}
.pill{flex:none;display:flex;align-items:center;gap:8px;min-height:44px;padding:0 15px;border:1px solid var(--line);border-radius:999px;background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 3px 12px rgba(61,64,91,.16);font-weight:700;font-size:13.5px;cursor:pointer;transition:all .15s}
.pill i{width:10px;height:10px;border-radius:50%;background:var(--muted);opacity:.5;transition:all .2s}
.pill.on i{background:var(--sage-d);opacity:1;box-shadow:0 0 0 3px var(--sage-bg)}
.pill.hot i{background:var(--terra);opacity:1}
.live{flex:none;display:flex;gap:7px;align-items:center;min-height:36px;padding:0 12px;border-radius:999px;background:var(--glass);border:1px solid var(--line);font-size:12.5px;font-weight:700;box-shadow:0 3px 12px rgba(61,64,91,.14)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--muted)}.live.on i{background:var(--sage-d);box-shadow:0 0 0 3px var(--sage-bg);animation:pu 2s infinite}
@keyframes pu{50%{box-shadow:0 0 0 6px transparent}}
#ctrls{position:absolute;z-index:4;right:12px;bottom:36px;display:flex;flex-direction:column;gap:8px}
.cb{width:48px;height:48px;border-radius:16px;border:1px solid var(--line);background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 3px 12px rgba(61,64,91,.2);display:grid;place-items:center;cursor:pointer;color:var(--ink);padding:0}
.cb:hover{filter:brightness(.97)}.cb:active{transform:scale(.94)}.cb.on{background:var(--sage-d);color:#fff}.cb.mut{color:var(--terra-d)}
.zm{display:flex;flex-direction:column;border-radius:16px;overflow:hidden;box-shadow:0 3px 12px rgba(61,64,91,.2);border:1px solid var(--line);background:var(--glass)}
.zm button{width:48px;height:46px;border:0;background:none;cursor:pointer;display:grid;place-items:center;color:var(--ink)}.zm button+button{border-top:1px solid var(--line)}
.zm button:hover{background:var(--hover)}
#cmp-i{transition:transform .2s}
.maplibregl-ctrl-bottom-left{left:424px}
.maplibregl-ctrl-scale{background:var(--glass)!important;color:var(--ink)!important;border-color:var(--muted)!important;font-family:inherit}
.maplibregl-ctrl-attrib{font-size:10.5px!important}
.maplibregl-popup-content{border-radius:16px;padding:12px 14px;font:13px/1.4 "Plus Jakarta Sans",system-ui,sans-serif;color:#3D405B;box-shadow:var(--shadow)}
.maplibregl-popup-content b{font-size:14px}.maplibregl-popup-content .pr{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 2px}
#toasts{position:absolute;z-index:30;left:50%;transform:translateX(-50%);bottom:24px;display:grid;gap:8px;width:min(440px,calc(100vw - 24px));pointer-events:none}
.toast{background:#3D405B;color:#F4F1DE;border-radius:14px;padding:11px 15px;box-shadow:var(--shadow);font-weight:600;font-size:13.5px;animation:rise .3s;pointer-events:auto}
#pick{position:absolute;z-index:12;top:14px;left:50%;transform:translateX(-50%);display:none;align-items:center;gap:12px;background:#3D405B;color:#F4F1DE;border-radius:999px;padding:6px 8px 6px 18px;font-weight:700;box-shadow:var(--shadow)}
#pick.on{display:flex}#pick button{border:0;border-radius:999px;background:#F4F1DE;color:#3D405B;min-height:40px;padding:0 16px;font-weight:800;cursor:pointer}
.pin{width:34px;height:34px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:3px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.4);display:grid;place-items:center;animation:drop .35s cubic-bezier(.3,1.6,.5,1)}
.pin::after{content:"";width:10px;height:10px;border-radius:50%;background:#fff}
@keyframes drop{from{transform:rotate(-45deg) translate(10px,-10px) scale(.4);opacity:0}}
.ab{width:30px;height:30px;border-radius:50%;border:3px solid #fff;color:#fff;font-weight:800;font-size:13px;display:grid;place-items:center;box-shadow:0 3px 10px rgba(0,0,0,.4)}
.me{width:18px;height:18px;border-radius:50%;background:#4285f4;border:3px solid #fff;box-shadow:0 0 0 6px rgba(66,133,244,.25)}
.puck{width:54px;height:54px;position:relative}
.puck::before{content:"";position:absolute;inset:6px;border-radius:50%;background:rgba(129,178,154,.35);animation:pu2 2s infinite}
@keyframes pu2{50%{transform:scale(1.3);opacity:.4}}
.puck svg{position:absolute;inset:9px;width:36px;height:36px;filter:drop-shadow(0 3px 5px rgba(0,0,0,.5))}

/* navigation mode */
#nav{position:absolute;inset:0;z-index:20;pointer-events:none;display:none}
body.navmode #nav{display:block}
body.navmode #panel,body.navmode #top,body.navmode #ctrls,body.navmode .maplibregl-ctrl-bottom-left{display:none}
#nav>*{pointer-events:auto}
#nv-wrap{position:absolute;top:max(10px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:min(560px,calc(100% - 20px));display:flex;flex-direction:column;gap:8px}
#nv-top{position:relative;width:100%;background:#3D405B;color:#F4F1DE;border-radius:24px;box-shadow:var(--shadow);padding:14px 16px;display:flex;gap:14px;align-items:center}
#nv-top .ico{width:68px;height:68px;border-radius:20px;background:rgba(244,241,222,.12);display:grid;place-items:center;flex:none;color:#F2CC8F}
#nv-top .ico svg{width:46px;height:46px;stroke-width:2.4}
#nv-top .d{font-family:var(--serif);font-size:44px;line-height:1}
#nv-top .t{font-weight:800;font-size:17px;line-height:1.25;margin-top:2px}
#nv-top .s{font-size:13px;opacity:.75;font-weight:600;margin-top:2px}
#nv-then{display:none;margin-top:-2px}
#nv-then div{display:inline-flex;gap:8px;align-items:center;background:#2c2e45;color:#F4F1DE;border-radius:14px;padding:7px 14px;font-weight:700;font-size:12.5px;box-shadow:var(--shadow)}
#nv-warn{position:relative;width:100%;display:none;align-items:center;gap:12px;padding:12px 16px;border-radius:20px;background:#F2CC8F;color:#3D405B;font-weight:800;font-size:18px;box-shadow:var(--shadow);animation:rise .3s}
#nv-warn.sev{background:#E07A5F;color:#fff;animation:rise .3s,flash 1s infinite}
@keyframes flash{50%{filter:brightness(1.18)}}
#nv-warn .wi{width:40px;height:40px;border-radius:50%;background:rgba(61,64,91,.15);display:grid;place-items:center;flex:none}
#nv-warn.sev .wi{background:rgba(255,255,255,.25)}
#nv-bar{position:absolute;left:50%;transform:translateX(-50%);bottom:max(12px,env(safe-area-inset-bottom));width:min(560px,calc(100% - 20px));background:var(--solid);color:var(--ink);border-radius:26px;box-shadow:var(--shadow);padding:12px 12px 12px 20px;display:flex;align-items:center;gap:14px}
#nv-bar .c{flex:1;display:flex;gap:18px;align-items:flex-end}
#nv-bar .c div{display:flex;flex-direction:column}#nv-bar .big{font-family:var(--serif);font-size:34px;line-height:1}#nv-bar small{color:var(--muted);font-weight:700;font-size:11.5px}
#nv-side{position:absolute;right:12px;bottom:calc(max(12px,env(safe-area-inset-bottom)) + 92px);display:flex;flex-direction:column;gap:8px;align-items:flex-end}

.sp{background:var(--solid);border-radius:18px;padding:8px 14px;box-shadow:var(--shadow);text-align:center;min-width:72px;border:3px solid var(--line)}
.sp b{font-family:var(--serif);font-size:30px;line-height:1;display:block}.sp small{font-size:10.5px;color:var(--muted);font-weight:800}
.sp.pc{border-color:var(--sage)}
#nv-rr{position:absolute;left:50%;transform:translateX(-50%);top:50%;display:none;background:#3D405B;color:#F4F1DE;padding:12px 20px;border-radius:999px;font-weight:800;box-shadow:var(--shadow)}
#nv-end{position:absolute;inset:0;display:none;place-items:center;background:rgba(40,42,60,.55)}
#nv-end .card2{background:var(--solid);border-radius:28px;padding:26px 24px;width:min(380px,calc(100% - 32px));text-align:center;box-shadow:var(--shadow);animation:rise .4s}
#nv-end .card2 .bigf{font-family:var(--serif);font-size:42px;line-height:1.05;margin:6px 0 4px}

@media (max-width:760px){
  :root{--sheet-h:150px}
  #panel{top:auto;left:0;right:0;bottom:0;width:auto;height:var(--sheet-h);max-height:none;border-radius:26px 26px 0 0;border-bottom:0;transition:height .38s cubic-bezier(.2,.9,.25,1);animation:none}
  #panel.drag{transition:none}
  #grab{display:flex}
  #head{padding-top:0}
  .brand{display:none}

}
@media (max-width:760px) and (max-height:600px){#nv-top .ico{width:54px;height:54px}}

/* second pass */
.cats{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding:8px 2px 2px;margin:0 -2px;-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent)}
.cats::-webkit-scrollbar{display:none}
.cats button{flex:none;display:flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border:1px solid var(--line);background:var(--solid);border-radius:999px;font-weight:700;font-size:12.5px;cursor:pointer;transition:all .15s;white-space:nowrap}
.cats button:hover{background:var(--hover)}.cats button .i{color:var(--sage-d);width:16px;height:16px}
.cats button.on{background:var(--sage-d);color:#fff;border-color:transparent}.cats button.on .i{color:#fff}
:root[data-theme=dark] .cats button.on{background:var(--sage);color:#1d2a24}:root[data-theme=dark] .cats button.on .i{color:#1d2a24}
.rowb.hi{background:var(--hover);box-shadow:inset 3px 0 0 var(--sage-d)}
.rd{flex:none;font-size:12px;font-weight:700;color:var(--muted)}
.hs{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;text-align:left;padding:8px 14px;min-height:56px;cursor:pointer}
.hs:hover{background:var(--hover)}
.hs .bar{width:6px;height:34px;border-radius:3px;flex:none}
.cmpt{margin:6px 12px 4px;border:1px solid var(--line);border-radius:16px;background:var(--solid);overflow:hidden;font-size:12.5px}
.cmpt table{width:100%;border-collapse:collapse}
.cmpt th{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:800;text-align:right;padding:7px 8px 4px}
.cmpt th:first-child,.cmpt td:first-child{text-align:left;padding-left:12px}
.cmpt td{text-align:right;padding:8px 8px;border-top:1px solid var(--line);font-weight:600;cursor:pointer}
.cmpt tr.sel td{background:var(--sage-bg)}.cmpt td.best{color:var(--sage-d);font-weight:800}
.cmpt td i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--muted)}
.cmpt tr.sel td i{background:var(--sage-d)}
#lay{position:absolute;z-index:8;right:72px;bottom:36px;width:250px;background:var(--glass);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:12px;display:none;animation:rise .25s}
#lay.on{display:block}
#lay h4{margin:2px 4px 8px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:800}
.bases{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.bases button{border:2px solid transparent;background:none;border-radius:14px;padding:0;cursor:pointer;font-weight:700;font-size:12px;color:var(--ink)}
.bases button i{display:block;height:46px;border-radius:11px;margin-bottom:4px;border:1px solid var(--line)}
.bases button.on{border-color:var(--sage-d)}
.ov{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:44px;border:0;background:none;padding:0 4px;font-weight:700;font-size:13.5px;cursor:pointer;border-radius:10px}
.ov:hover{background:var(--hover)}
.ov .tr{width:38px;height:22px;border-radius:11px;background:var(--line);position:relative;transition:background .2s;filter:contrast(1.6)}
.ov .tr::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.ov[aria-checked=true] .tr{background:var(--sage-d);filter:none}.ov[aria-checked=true] .tr::after{transform:translateX(16px)}
#pcol{position:absolute;z-index:7;left:412px;top:50%;width:22px;height:56px;margin-top:-28px;border:1px solid var(--line);border-left:0;border-radius:0 12px 12px 0;background:var(--glass);cursor:pointer;display:grid;place-items:center;color:var(--muted);padding:0;transition:left .35s cubic-bezier(.2,.8,.2,1)}
#pcol:hover{color:var(--ink)}#pcol .i{width:16px;height:16px;transition:transform .3s}
body.pcol #pcol{left:0}body.pcol #pcol .i{transform:rotate(180deg)}
#panel{transition:transform .35s cubic-bezier(.2,.8,.2,1)}
body.pcol #panel{transform:translateX(calc(-100% - 24px))}
body.pcol #top{left:36px}body.pcol .maplibregl-ctrl-bottom-left{left:36px}
#top{transition:left .35s cubic-bezier(.2,.8,.2,1)}
.catpin{display:flex;flex-direction:column;align-items:center;cursor:pointer}
.catpin b{width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:#3F7A60;border:2.5px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.4);display:grid;place-items:center;animation:drop .35s cubic-bezier(.3,1.6,.5,1)}
.catpin b svg{transform:rotate(45deg);width:15px;height:15px;stroke:#fff;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.catpin span{margin-top:3px;max-width:110px;padding:2px 7px;border-radius:8px;background:rgba(255,255,255,.94);color:#3D405B;font:700 11px/1.2 "Plus Jakarta Sans",sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.actions .btn.ic{flex:none;width:52px;padding:0}
#pills{-webkit-mask-image:linear-gradient(90deg,#000 92%,transparent);mask-image:linear-gradient(90deg,#000 92%,transparent);padding-right:18px}
@media (max-width:760px){
  #pcol{display:none}
  #top{left:0;right:0;top:calc(8px + env(safe-area-inset-top));padding:0 0 0 10px;gap:6px}
  #pills{gap:6px}
  .pill{min-height:40px;padding:0 13px}
  .live{margin-right:10px}
  #head{padding:0 12px 6px}
  .searchbar{height:48px}
  .cats{padding-top:7px}
  .cats button{min-height:38px}
  #body{padding-bottom:calc(14px + env(safe-area-inset-bottom))}

  body.sh-full #top{opacity:0;pointer-events:none}
  #lay{right:70px;bottom:calc(var(--sheet-h) + 14px)}

}
@media (max-width:760px){
  .mt{margin-bottom:6px}.modes button{height:38px}.fi>div{height:40px}.opts{margin-top:2px}.sw{min-height:40px}
  .msg{margin:6px 12px;padding:9px 12px;font-size:13px}
  .dep{display:none}
}
@media (max-width:760px) and (max-height:760px){#ctrls #b3d{display:none}.zm button{height:42px}}

/* citizen mode */
body.cz{font-size:15.5px}
body.embed #panel,body.embed .brand,body.embed #sheet,body.embed #toasts,body.embed #pcol{display:none!important}
body.embed #pills{top:10px;left:10px}
body.embed #embedbar{display:flex}
#embedbar{display:none;position:absolute;left:10px;bottom:34px;z-index:6;gap:6px;flex-wrap:wrap;max-width:calc(100% - 90px)}
#embedbar button,#embedbar a{font:700 12.5px "Plus Jakarta Sans",system-ui,sans-serif;padding:7px 12px;border-radius:999px;border:1px solid rgba(61,64,91,.18);background:rgba(251,249,239,.94);color:#3D405B;cursor:pointer;text-decoration:none;box-shadow:0 2px 8px rgba(61,64,91,.14);backdrop-filter:blur(6px)}
#embedbar button.on{background:#81B29A;border-color:#81B29A;color:#2F3249}
#embedbar a.open{background:#3D405B;color:#F4F1DE;border-color:#3D405B}
.maplibregl-popup-content{font-family:"Plus Jakarta Sans",system-ui,sans-serif;border-radius:14px;padding:12px 14px;min-width:190px}
.ep h4{margin:0 0 4px;font-size:15px}.ep .m{color:#5E617A;font-size:12.5px;margin:2px 0}.ep .b{margin-top:8px;display:flex;gap:6px}
.ep .b a,.ep .b button{font:700 12px inherit;padding:6px 11px;border-radius:999px;border:1px solid #d9d4bd;background:#fff;color:#3D405B;cursor:pointer;text-decoration:none}
.ep .b a.p{background:#81B29A;border-color:#81B29A;color:#2F3249}
body.cz #pills,body.cz .live,body.cz #hot,body.cz .cats,body.cz #b3d,body.cz #bcomp{display:none!important}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:8px 14px 4px}
.tile{display:flex;align-items:center;gap:11px;min-height:64px;border:1px solid var(--line);background:var(--solid);border-radius:20px;padding:8px 12px;cursor:pointer;text-align:left;transition:transform .12s,box-shadow .15s}
.tile:active{transform:scale(.97)}.tile:hover{box-shadow:0 4px 14px rgba(61,64,91,.14)}
.tile .ric{width:42px;height:42px}.tile b{display:block;font-size:15px;font-weight:800}.tile small{display:block;color:var(--muted);font-size:12px;font-weight:600;max-width:96px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.choose{margin:6px 14px 0}.ch-t{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.delta{font-family:var(--serif);font-size:32px;line-height:1.08;margin:6px 0 12px}.delta.ok{color:var(--sage-d)}
.opts2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.opts2.one{grid-template-columns:1fr}
.opt{border:2px solid var(--line);background:var(--solid);border-radius:22px;padding:12px 12px 14px;cursor:pointer;text-align:left;transition:all .15s;color:var(--ink)}
.opt.sel{border-color:var(--sage-d);box-shadow:0 0 0 4px var(--sage-bg)}.opt.fast.sel{border-color:var(--terra);box-shadow:0 0 0 4px var(--terra-bg)}
.opt .k{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}.opt.fast .k{color:var(--terra-d)}.opt.smooth .k{color:var(--sage-d)}
.opt .tm{font-family:var(--serif);font-size:44px;line-height:1;margin-top:4px}.opt .tm small{font:700 14px "Plus Jakarta Sans",sans-serif;color:var(--muted);margin-left:4px}
.opt .km{font-weight:600;color:var(--muted);font-size:13px;margin-top:2px}
.opt .pc{font-weight:800;font-size:15px;margin-top:10px}.opt .pc small{display:block;font-weight:600;color:var(--muted);font-size:12px;margin-top:1px}
.rb{height:8px;border-radius:4px;background:var(--field);margin-top:10px;overflow:hidden}.rb i{display:block;height:100%;border-radius:4px}
.warnb{margin:8px 14px 2px;padding:14px;border-radius:20px;background:var(--terra-bg);border:1.5px solid var(--terra)}
.warnb b{display:block;font-size:15px;line-height:1.3;color:var(--terra-d)}.warnb .btn{margin-top:10px;width:100%}
.btn.xl{min-height:56px;font-size:16px;border-radius:18px}
.report{margin:10px 14px 4px;display:flex;align-items:center;gap:12px;width:calc(100% - 28px);min-height:56px;border:1.5px dashed var(--terra);background:var(--terra-bg);color:var(--terra-d);border-radius:18px;padding:0 14px;font-weight:800;font-size:14.5px;cursor:pointer}
.btnrow{display:flex;gap:10px;padding:12px 14px 4px}.lnk{display:block;margin:2px auto 6px;border:0;background:none;color:var(--muted);font-weight:700;font-size:13px;min-height:44px;cursor:pointer;text-decoration:underline}
body.cz .btn,body.cz .rowb,body.cz .qc button{min-height:52px}
body.cz .cb{width:52px;height:52px}
body.cz #top{pointer-events:none}
body.cz #panel{overflow-y:auto;overscroll-behavior:contain}
body.cz #body{overflow:visible;flex:none}
body.cz #head{flex:none}body.cz #grab{position:sticky;top:0;z-index:3;background:var(--solid);min-height:26px}
body.cz .delta{font-size:28px;margin-bottom:10px}body.cz .opts{display:none}body.cz .warnb{padding:10px 12px;margin-top:4px}body.cz .warnb b{font-size:14px}body.cz .fi>div{height:38px}body.cz .mt{margin-bottom:4px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="map"></div>

<div id="top">
  <div id="embedbar" role="group" aria-label="Map filters"><button class="on" data-f="all">All</button><button data-f="serious">Serious</button><button data-f="other">Moderate and minor</button><button data-f="fixed">Repaired</button><a class="open" href="/map" target="_top" id="embedopen">Open full map</a></div>
  <div id="pills">
    <button class="pill on" data-l="heat" aria-pressed="true" title="Damage heatmap"><i></i>Heatmap</button>
    <button class="pill on" data-l="defects" aria-pressed="true" title="Pothole pins at street level"><i></i>Potholes</button>
    <button class="pill" data-l="zones" aria-pressed="false" title="Damage zones"><i></i>Zones</button>
    <button class="pill hot" id="hot" hidden title="Jump to the next red zone"><i></i><span>Red zones: 0</span></button>
  </div>
  <div class="live" id="live" role="status"><i></i><span>Connecting</span></div>
</div>

<div id="ctrls">
  <button class="cb" id="blay" aria-label="Map layers" title="Map layers"><svg class="i" viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5M3 17.5l9 5 9-5" opacity=".6"/></svg></button>
  <button class="cb" id="b3d" aria-label="Toggle 3D view" title="3D view"><svg class="i" viewBox="0 0 24 24"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 12l8-4.5M12 12L4 7.5M12 12v9"/></svg></button>
  <button class="cb" id="bcomp" aria-label="Compass, reset north" title="Reset north"><svg class="i" id="cmp-i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg></button>
  <button class="cb" id="bloc" aria-label="Show my location" title="My location"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><circle cx="12" cy="12" r="8"/><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3"/></svg></button>
  <div class="zm"><button id="zin" aria-label="Zoom in"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button><button id="zout" aria-label="Zoom out"><svg class="i" viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button></div>
</div>

<aside id="panel" aria-label="Map panel">
  <div id="grab" role="separator" aria-label="Drag to resize panel"><i></i></div>
  <div id="head"></div>
  <div id="body"></div>
  <div class="brand ext"><span>Road data from citizen reports</span><a href="/" target="_top">Disha AI</a></div>
</aside>

<div id="lay" role="dialog" aria-label="Map layers">
  <h4>Map type</h4>
  <div class="bases"><button data-b="default" class="on"><i style="background:linear-gradient(135deg,#f4efe0,#e9dfc0 50%,#cfe3d6)"></i>Default</button><button data-b="satellite"><i style="background:linear-gradient(135deg,#3b5a3a,#6b7a52 50%,#2d4a5e)"></i>Satellite</button><button data-b="dark"><i style="background:linear-gradient(135deg,#1d1f2c,#34374d 60%,#242636)"></i>Dark</button></div>
  <h4>Overlays</h4>
  <button class="ov" role="switch" data-ov="heat" aria-checked="true">Damage heatmap<span class="tr"></span></button>
  <button class="ov" role="switch" data-ov="defects" aria-checked="true">Potholes<span class="tr"></span></button>
  <button class="ov" role="switch" data-ov="zones" aria-checked="false">Damage zones<span class="tr"></span></button>
  <button class="ov" role="switch" data-ov="b3d" aria-checked="true">3D buildings<span class="tr"></span></button>
</div>
<button id="pcol" aria-label="Collapse panel" title="Collapse panel"><svg class="i" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
<div id="pick"><span>Tap the map to choose a point</span><button id="pick-x">Cancel</button></div>

<div id="nav" aria-live="polite">
  <div id="nv-wrap"><div id="nv-top"><div class="ico" id="nv-ico"></div><div style="min-width:0"><div class="d" id="nv-d">--</div><div class="t" id="nv-t">Starting navigation</div><div class="s" id="nv-s"></div></div></div>
  <div id="nv-then"><div id="nv-then-in"></div></div>
  <div id="nv-warn"><span class="wi" id="nv-wi"></span><span id="nv-wt"></span></div></div>
  <div id="nv-rr">Rerouting...</div>
  <div id="nv-speed"><div class="sp"><b id="nv-sp">0</b><small>KM/H</small></div><div class="sp pc" title="Potholes passed"><b id="nv-pc">0</b><small>PASSED</small></div></div>
  <div id="nv-side"><button class="cb" id="nv-mute" aria-label="Mute voice guidance"></button><button class="cb" id="nv-rec" aria-label="Recenter" style="display:none"></button></div>
  <div id="nv-bar"><div class="c"><div><span class="big" id="nv-min">--</span><small>remaining</small></div><div><span class="big" id="nv-km">--</span><small id="nv-kmu">km</small></div><div><span class="big" id="nv-eta">--</span><small>arrival</small></div></div><button class="btn d big" id="nv-stop" style="flex:none;min-width:84px">End</button></div>
  <div id="nv-end"><div class="card2"><div class="ser" style="font-size:20px;color:var(--muted)">Arrived</div><div class="bigf" id="nv-end-t">You have arrived</div><div id="nv-end-s" style="color:var(--muted);font-weight:600;margin-bottom:16px"></div><button class="btn p big" id="nv-done" style="width:100%">Done</button></div></div>
</div>
<div id="toasts" role="status"></div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
(function () {
  "use strict";
  var Q = new URLSearchParams(location.search);
  var $ = function (id) { return document.getElementById(id); };
  function esc(t) { return String(t == null ? "" : t).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function lsGet(k, d) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
  function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

  var EMBED = Q.get("embed") === "1"; if (EMBED) document.body.classList.add("embed");
  var APP = Q.get("app") === "1"; if (APP) document.body.classList.add("app");
  var CZ = (APP || Q.get("cz") === "1" || window.innerWidth < 700) && !EMBED; if (CZ) document.body.classList.add("cz");
  function homeSnap() { return CZ ? "half" : "peek"; }
  var LANG = (Q.get("lang") || "en").toLowerCase().indexOf("hi") === 0 ? "hi" : "en";
  var SIM_KMH = parseFloat(Q.get("simkmh")) || 40;
  var themeParam = Q.get("theme");
  var mq = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;
  function curTheme() { return themeParam === "dark" || themeParam === "light" ? themeParam : (mq && mq.matches ? "dark" : "light"); }
  document.documentElement.setAttribute("data-theme", curTheme());
